<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessmate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♛</text></svg>">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        h1 { font-size: 3rem; margin: 0 0 8px 0; letter-spacing: 2px; }
        p { color: #aaa; margin: 0 0 28px 0; font-size: 1rem; }
        form { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 260px; }
        input[type="password"] {
            padding: 12px 20px;
            font-size: 1rem;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #f0f0f0;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            outline: none;
        }
        button {
            padding: 12px 0;
            font-size: 1rem;
            background: #f0f0f0;
            color: #1a1a1a;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
            width: 100%;
        }
        button:hover { background: #ccc; }
        .error { color: #c0392b; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>chessmate</h1>
    <p>for andrew and nasha only :)</p>
    <form method="POST">
        <input type="password" name="password" placeholder="password" autofocus />
        <button type="submit">enter</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
</body>
</html>
